{% extends 'base.html' %}
{% block content %}
<div class="auth-wrap">
    <div class="card auth-card">
        <div class="card-header section-primary text-white">
            <h3 class="mb-0"><i class="bi bi-box-arrow-in-right me-1"></i>Login</h3>
        </div>
        <div class="card-body">
            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Login As</label>
                    <select name="role" class="form-select">
                        <option value="">Select Role</option>
                        <option value="admin">Admin</option>
                        <option value="company">Company</option>
                        <option value="student">Student</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="form-label">Email/Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <p class="text-muted mb-3">For admin, use username. For others, use email.</p>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Login
                </button>
            </form>

            <hr>
            <p class="text-center mb-2 fw-semibold">Don't have an account?</p>
            <div class="d-flex justify-content-center gap-2 flex-wrap">
                <a class="btn btn-sm btn-outline-success" href="{{ url_for('auth.register_student') }}">Register as Student</a>
                <a class="btn btn-sm btn-outline-info" href="{{ url_for('auth.register_company') }}">Register as Company</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block content %}
<h3 class="page-title"><i class="bi bi-file-earmark-person"></i>Update Applications - {{ drive.drive_name }}</h3>

<div class="card section-primary">
    <div class="card-body table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>Student</th><th>Review</th></tr></thead>
            <tbody>
            {% for app in applications %}
                <tr>
                    <td>{{ app.student.name }}</td>
                    <td>
                        <a class="btn btn-sm btn-outline-primary" href="{{ url_for('company.student_application', application_id=app.id) }}">Review Application</a>
                    </td>
                </tr>
            {% else %}
                <tr><td colspan="2" class="text-muted">No students applied yet.</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

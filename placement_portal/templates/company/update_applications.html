{% extends 'base.html' %}
{% block content %}
<h4 class="mb-3">Update Applications - {{ drive.drive_name }}</h4>

<div class="card">
    <div class="card-body table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>Student</th><th>Review</th></tr></thead>
            <tbody>
            {% for app in applications %}
                <tr>
                    <td>{{ app.student.name }}</td>
                    <td>
                        <a class="btn btn-sm btn-outline-primary" href="{{ url_for('company.student_application', application_id=app.id) }}">Review Application</a>
                    </td>
                </tr>
            {% else %}
                <tr><td colspan="2" class="text-muted">No students applied yet.</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

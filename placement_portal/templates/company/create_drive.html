{% extends 'base.html' %}
{% block content %}
<div class="card">
    <div class="card-header">Create Drive</div>
    <div class="card-body">
        <form method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Drive Name</label>
                    <input type="text" name="drive_name" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Job Title</label>
                    <input type="text" name="job_title" class="form-control" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Job Description</label>
                    <textarea name="job_description" class="form-control" rows="3" required></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">Eligibility Criteria</label>
                    <textarea name="eligibility" class="form-control" rows="2" required></textarea>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Salary</label>
                    <input type="text" name="salary" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Location</label>
                    <input type="text" name="location" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Application Deadline</label>
                    <input type="date" name="application_deadline" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Save</button>
        </form>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card section-sky">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-building-add me-1"></i>Company Registration</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Company Name</label>
                            <input type="text" name="company_name" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">HR Contact</label>
                            <input type="text" name="hr_contact" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Website</label>
                            <input type="text" name="website" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                    </div>
                    <button class="btn btn-info mt-3 text-white" type="submit"><i class="bi bi-check2-circle me-1"></i>Register Company</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

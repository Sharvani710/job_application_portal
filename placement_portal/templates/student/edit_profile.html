{% extends 'base.html' %}
{% block content %}
<h3 class="page-title"><i class="bi bi-pencil-square"></i>Edit Profile</h3>

<div class="card section-primary profile-card">
    <div class="card-header">Student Profile</div>
    <div class="card-body">
        <form method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-control" value="{{ current_user.name }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Department</label>
                    <input type="text" name="department" class="form-control" value="{{ current_user.department }}" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Resume</label>
                    <textarea name="resume" class="form-control" rows="3" placeholder="Resume URL or details">{{ current_user.resume or '' }}</textarea>
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button class="btn btn-success" type="submit">save</button>
                <a class="btn btn-outline-secondary" href="{{ url_for('student.dashboard') }}">cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
